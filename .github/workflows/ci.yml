name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kc.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kc.tar.gz -C /usr/local/bin kubeconform
      - name: Build every app and validate it (CRDs included)
        run: |
          for app in apps/*/; do
            echo "::group::${app}"
            kubectl kustomize "$app" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

  code:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript parses
        run: node --check apps/uptime/kuma-config/configure.js
      - name: Shell scripts pass shellcheck
        run: shellcheck image-mirror/.forgejo/scripts/mirror-images.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
