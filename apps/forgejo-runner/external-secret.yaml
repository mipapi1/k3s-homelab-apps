# The runner's shared secret, registered in Forgejo with `forgejo-cli actions register`
# (name k3s-runner, global, label host).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: forgejo-runner
  data:
    - {secretKey: secret, remoteRef: {key: k8s/forgejo/runner, property: secret}}
