# deployments/gpu_plugin/base/intel-gpu-plugin.yaml (v0.37.1), with the image pinned and
# two pods allowed per GPU (e.g. Plex, plus room for a second user).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-gpu-plugin
  labels: {app: intel-gpu-plugin}
spec:
  selector:
    matchLabels: {app: intel-gpu-plugin}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  template:
    metadata:
      labels: {app: intel-gpu-plugin}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: intel-gpu-plugin
          image: intel/intel-gpu-plugin:0.37.1@sha256:004641b2547d58f1eadce58473fa160ad71377de1eb588cf1f82832387bf3e33
          args: [-shared-dev-num=2]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: HOST_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 40m, memory: 45Mi}
            limits: {cpu: 100m, memory: 115Mi}
          volumeMounts:
            - {name: devfs, mountPath: /dev/dri, readOnly: true}
            - {name: sysfsdrm, mountPath: /sys/class/drm, readOnly: true}
            - {name: kubeletsockets, mountPath: /var/lib/kubelet/device-plugins}
            - {name: cdipath, mountPath: /var/run/cdi}
      volumes:
        # DirectoryOrCreate: a node without a GPU yet still starts the plugin (it then
        # just offers nothing) instead of failing the mount
        - name: devfs
          hostPath: {path: /dev/dri, type: DirectoryOrCreate}
        - name: sysfsdrm
          hostPath: {path: /sys/class/drm}
        - name: kubeletsockets
          hostPath: {path: /var/lib/kubelet/device-plugins}
        - name: cdipath
          hostPath: {path: /var/run/cdi, type: DirectoryOrCreate}
      nodeSelector:
        kubernetes.io/arch: amd64
