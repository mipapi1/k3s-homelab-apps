# Forgejo token of the ci-bot user (scopes: repository + issues write, user/org/package read)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: vault}
  target:
    name: renovate
  data:
    - {secretKey: RENOVATE_TOKEN, remoteRef: {key: k8s/forgejo/ci-bot, property: renovate-token}}
